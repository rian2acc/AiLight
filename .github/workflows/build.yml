name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  DOTNET_VERSION: '8.0.x'

# Der Veröffentlichungs-Schritt hängt Installer, ZIP und Prüfsummen an das
# Release — dafür braucht das automatische Token Schreibrechte auf den Inhalt.
permissions:
  contents: write

jobs:
  build:
    name: Build & Self-Test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/AIlight/AIlight.csproj

      - name: Build (Release)
        run: dotnet build src/AIlight/AIlight.csproj -c Release --no-restore

      - name: Run Self-Test (59 assertions)
        run: |
          # Gleicher Publish wie tools/build.ps1: self-contained, ohne Trimmen —
          # Trimmen unterstützt WPF/WinForms nicht (NETSDK1175) und kann Laufzeitcode entfernen.
          dotnet publish src/AIlight/AIlight.csproj -c Release -o dist/publish --self-contained true -r win-x64
          cd dist/publish
          .\AIlight.exe --selftest

      - name: Upload test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-output
          path: dist/publish/
          retention-days: 7

  package:
    name: Create Installer
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    if: github.event_name == 'release' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Ensure Inno Setup
        run: |
          # Der Runner hat Inno Setup schon installiert — dann nur benutzen.
          # Nur wenn es fehlt, frisch über Chocolatey holen (kein Pin: ein
          # Downgrade würde fehlschlagen, sobald der Runner neuer ist).
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y
            $iscc = Get-ChildItem -Path 'C:\Program Files (x86)\Inno Setup*', 'C:\Program Files\Inno Setup*' -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw 'Inno Setup (ISCC.exe) wurde nicht gefunden.' }
          Write-Host "ISCC: $iscc"
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installer
        run: |
          dotnet publish src/AIlight/AIlight.csproj -c Release -o dist/publish --self-contained true -r win-x64
          & $env:ISCC packaging/ailight.iss

      # Signieren nur, wenn ein Zertifikat als Repository-Geheimnis hinterlegt ist
      # (SIGNING_PFX_BASE64 + SIGNING_PFX_PASSWORD). Ohne Geheimnis läuft der
      # Schritt nicht — der Installer ist dann unsigniert, siehe docs/signieren.md.
      - name: Sign (optional)
        if: ${{ secrets.SIGNING_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String("${{ secrets.SIGNING_PFX_BASE64 }}"))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          foreach ($file in @('dist\publish\AIlight.exe', 'dist\installer\AIlightSetup.exe')) {
            & $signtool sign /f $pfx /p "${{ secrets.SIGNING_PFX_PASSWORD }}" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $file
            if ($LASTEXITCODE -ne 0) { throw "Signieren fehlgeschlagen: $file" }
            Write-Host "signiert: $file"
          }

      # Die Portable-Fassung enthält dasselbe Programm ohne Installer: wer bei
      # seinem Virenschutz aneckt, kann sie einfach entpacken und starten.
      - name: Portable copy and checksums
        shell: pwsh
        run: |
          $zip = 'dist\installer\AIlightPortable.zip'
          Compress-Archive -Path 'dist\publish\*' -DestinationPath $zip -CompressionLevel Optimal -Force
          $lines = @()
          foreach ($file in @('dist\installer\AIlightSetup.exe', $zip)) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash  $(Split-Path -Leaf $file)"
            Write-Host ("{0}  {1}" -f $hash, (Split-Path -Leaf $file))
          }
          [IO.File]::WriteAllText('dist\installer\SHA256SUMS.txt', ($lines -join "`n") + "`n")

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AIlightSetup
          path: |
            dist/installer/AIlightSetup.exe
            dist/installer/AIlightPortable.zip
            dist/installer/SHA256SUMS.txt
          retention-days: 30

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/AIlightSetup.exe
            dist/installer/AIlightPortable.zip
            dist/installer/SHA256SUMS.txt